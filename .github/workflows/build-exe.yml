name: build-exe
# 在 GitHub 云端的 Windows 机器上打包实时翻译 v2.9.0：不需要自己电脑装 Python。
# 用法：Actions → build-exe → Run workflow，跑完在页面底部 Artifacts 里下载。
# 两个构建：
#   标准版：RealtimeTranslate.exe（免安装，约 13 MB）+ RealtimeTranslate_Setup_v2.9.0.exe（安装包）
#   离线版：构建时在本地下载语言包（offline_models.txt 默认中↔英两对，约 100~240 MB）
#     打进安装包 RealtimeTranslate_Offline_Setup_v2.9.0.exe 和免安装文件夹
#     RealtimeTranslateOffline，装完/解压完直接能离线用，不用再在程序里下载。
# 推 v* 标签时自动跑，并把安装包挂到对应 Release 上。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile desktop_translator.py tray_win32.py screen_win.py ocr_win.py
      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check "pyinstaller>=6.0"
      - name: Build exe
        env:
          PYTHONUTF8: "1"
        run: python -m PyInstaller --noconfirm --clean realtime_translate.spec
      - name: Verify exe and copy to root
        shell: pwsh
        run: |
          if (-not (Test-Path dist\RealtimeTranslate.exe)) { throw "dist\RealtimeTranslate.exe not found" }
          Copy-Item dist\RealtimeTranslate.exe RealtimeTranslate.exe -Force
          (Get-FileHash RealtimeTranslate.exe -Algorithm SHA256).Hash
      - name: Install Inno Setup and build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
      - name: Upload exe artifact
        uses: actions/upload-artifact@v7
        with:
          name: RealtimeTranslate-exe
          path: RealtimeTranslate.exe
      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: RealtimeTranslate-setup
          path: Output\RealtimeTranslate_Setup_v*.exe
      - name: Attach to Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            RealtimeTranslate.exe
            Output\RealtimeTranslate_Setup_v*.exe
          generate_release_notes: true

  build-offline:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: "x64"
      - name: Syntax check
        run: python -m py_compile desktop_translator.py tray_win32.py screen_win.py ocr_win.py offline_engine.py netcheck.py prepare_offline_models.py
      - name: Install build deps
        run: python -m pip install --disable-pip-version-check "pyinstaller>=6.0" ctranslate2 sentencepiece numpy
      - name: Download language packs locally
        shell: pwsh
        run: |
          python prepare_offline_models.py
          $code = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($code -eq 2) { throw "no language packs available, cannot build offline version" }
      - name: Build offline exe
        env:
          PYTHONUTF8: "1"
        run: python -m PyInstaller --noconfirm --clean realtime_translate_offline.spec
      - name: Self-test (load model, translate a sentence)
        shell: pwsh
        run: |
          if (-not (Test-Path dist\RealtimeTranslateOffline\RealtimeTranslate.exe)) { throw "offline exe not found" }
          $p = Start-Process -FilePath "dist\RealtimeTranslateOffline\RealtimeTranslate.exe" -ArgumentList "--selftest" -Wait -PassThru
          if (Test-Path "$env:APPDATA\RealtimeTranslate\selftest.txt") { Get-Content "$env:APPDATA\RealtimeTranslate\selftest.txt" }
          if ($p.ExitCode -ne 0) { throw "self-test failed" }
      - name: Install Inno Setup and build offline installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DOFFLINE=1 installer.iss
      - name: Upload offline installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: RealtimeTranslate-offline-setup
          path: Output\RealtimeTranslate_Offline_Setup_v*.exe
      - name: Upload offline portable folder artifact
        uses: actions/upload-artifact@v7
        with:
          name: RealtimeTranslate-offline-portable
          path: dist\RealtimeTranslateOffline\
      - name: Attach to Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output\RealtimeTranslate_Offline_Setup_v*.exe
          generate_release_notes: true
